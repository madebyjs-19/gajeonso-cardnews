name: 텔레그램 승인 후 발행

on:
  push:
    branches: [main]
    paths: ["cards/*/approval.txt"]
  workflow_dispatch:
    inputs:
      date:
        description: "회차 폴더명 (예: 20261009b)"
        required: true

permissions:
  contents: write

concurrency:
  group: cardnews-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 영상 합성 의존성 설치
        timeout-minutes: 10
        continue-on-error: true   # ffmpeg 를 못 깔아도 카드뉴스 승인·발행은 진행한다(릴스만 실패)
        run: |
          pip install pillow google-auth requests
          if command -v ffmpeg > /dev/null && command -v ffprobe > /dev/null; then exit 0; fi
          # 1순위: GitHub 릴리스의 정적 빌드(Actions 에서 가장 안정적) → 2순위: apt(시간 제한)
          if curl -fsSL --retry 3 --connect-timeout 20 --max-time 180 -o /tmp/ff.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo cp /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          else
            echo "GitHub 정적 빌드 실패 → apt"
            timeout 180 sudo apt-get update -qq || true
            timeout 240 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version > /dev/null
      - name: 대상 회차 찾기
        id: dates
        env:
          INPUT_DATE: ${{ inputs.date }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_DATE" ]; then list="$INPUT_DATE"; else
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE=$(git rev-parse HEAD~1)
            list=$(git diff --name-only "$BEFORE" HEAD -- 'cards/*/approval.txt' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: 승인 대기 후 발행
        if: steps.dates.outputs.list != ''
        env:
          LIST: ${{ steps.dates.outputs.list }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python approval_publish.py $LIST
      - name: 결과 기록 커밋
        if: always() && steps.dates.outputs.list != ''
        env:
          LIST: ${{ steps.dates.outputs.list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log cards
          git diff --cached --quiet && exit 0
          git commit -m "발행 결과 기록: $LIST"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
