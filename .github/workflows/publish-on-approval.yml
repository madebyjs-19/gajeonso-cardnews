name: 텔레그램 승인 후 발행

on:
  push:
    branches: [main]
    paths: ["cards/*/approval.txt"]
  workflow_dispatch:
    inputs:
      date:
        description: "회차 폴더명 (예: 20261009b)"
        required: true

permissions:
  contents: write

concurrency:
  group: cardnews-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 대상 회차 찾기
        id: dates
        env:
          INPUT_DATE: ${{ inputs.date }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$INPUT_DATE" ]; then list="$INPUT_DATE"; else
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null || BEFORE=$(git rev-parse HEAD~1)
            list=$(git diff --name-only "$BEFORE" HEAD -- 'cards/*/approval.txt' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - name: 승인 대기 후 발행
        if: steps.dates.outputs.list != ''
        env:
          LIST: ${{ steps.dates.outputs.list }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: python approval_publish.py $LIST
      - name: 결과 기록 커밋
        if: always() && steps.dates.outputs.list != ''
        env:
          LIST: ${{ steps.dates.outputs.list }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add log cards
          git diff --cached --quiet && exit 0
          git commit -m "발행 결과 기록: $LIST"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
