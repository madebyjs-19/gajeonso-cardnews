name: Daily gajeonso cardnews

on:
  schedule:
    - cron: '7,17,27,37,47,57 0-14,21-23 * * *' # 한국 06:07~23:57, 일찍 제작·지연 복구
    - cron: '0 2 * * *'                  # 한국 11:00 목표 발행
  workflow_dispatch:
    inputs:
      phase:
        description: 'check is read-only; prepare sends previews; publish requires Telegram approval'
        required: true
        type: choice
        default: check
        options: [check, tick, prepare, approval, publish]

# All production mutation workflows must share this exact group.
concurrency:
  group: gajeonso-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.GAJEONSO_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 아침 승인 수신·11시 대기 + 발행 여유
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_APPROVER_ID: ${{ secrets.TELEGRAM_APPROVER_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      GAJEONSO_DURABLE_GIT: '1'
      REQUESTED_PHASE: ${{ inputs.phase }}
      TRIGGER_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Run scheduled phase
        run: |
          if [ -z "$REQUESTED_PHASE" ]; then
            REQUESTED_PHASE=tick
          fi
          python daily_automation.py "$REQUESTED_PHASE"
      - name: Preserve recovery files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.run_id }}
          path: |
            log/publish-state/*.json
            log/telegram-offset.json
            out/*/fact-qa-*.json
          retention-days: 14
          if-no-files-found: ignore
